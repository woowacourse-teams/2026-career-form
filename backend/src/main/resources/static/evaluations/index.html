<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI 평가 — Career Form</title>
  <link rel="stylesheet" href="/quality/quality.css">
  <link rel="stylesheet" href="/evaluations/styles.css">
  <script type="module" src="/quality/login.js"></script>
</head>
<body data-app="/evaluations/app.js">
  <main id="login-panel" class="login-card">
    <p class="eyebrow">CAREER FORM</p>
    <h1>AI 평가</h1>
    <p>팀 공용 비밀번호로 모델 평가 실행과 결과 화면에 접근합니다.</p>
    <form id="login-form">
      <label for="password">공용 비밀번호</label>
      <input id="password" type="password" autocomplete="off" maxlength="1024" required>
      <button type="submit">로그인</button>
    </form>
    <p id="login-message" role="status" aria-live="polite"></p>
  </main>
  <div id="management-panel" hidden>
    <div id="cf-eval-preview">
      <header><span class="brand">Career Form</span><span class="muted">/</span><span class="muted">AI Evaluation</span></header>
      <main>
        <div class="heading"><h1>AI 평가</h1><button type="button" class="run-action secondary-action" id="provider-open">공급자 관리</button><button type="button" class="run-action" id="run-open">평가 실행</button></div>
        <p class="run-status" aria-live="polite" id="cf-status"></p>
        <div class="filters">
          <div class="models" id="models" aria-label="비교할 모델"></div>
          <label><span class="muted">비교</span><select id="comparison" aria-label="비교할 실행 묶음"></select></label><label class="baseline-pick"><span class="muted">기준</span><select id="baseline" aria-label="비교 기준 실행"></select></label><span class="muted comparison-detail" id="comparison-detail"></span><button type="button" class="icon-button copy-button" id="result-copy" aria-label="결과 요약 복사" title="결과 요약 복사(PR에 붙이기)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button><button type="button" class="icon-button" id="record-delete" aria-label="이 비교 기록 삭제" title="이 비교 기록 삭제"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
        </div>
        <div class="context">
          <a href="#cf-source" data-source="데이터셋">데이터셋</a>
          <a href="#cf-source" data-source="정답 기준">정답 기준</a>
          <a href="#cf-source" data-source="프롬프트">프롬프트</a>
          <a href="/evaluations/collection-skill.md" download="career-form-collection-skill.md">수집 지침 내려받기</a>
          <span id="profile-count">프로필 0개</span><span id="site-count">사이트 0개</span>
        </div>
        <section id="cf-progress" class="progress-panel" aria-label="모델별 분석 진행" hidden></section>
        <nav class="page-nav" aria-label="평가 화면"><button type="button" data-page="overview" aria-pressed="true">품질 · 성능</button><button type="button" data-page="fields" aria-pressed="false">항목별 비교</button><button type="button" data-page="tokens" aria-pressed="false">토큰 사용량</button></nav>
        <div class="overview-stage" id="cf-overview-stage"><div class="stage" aria-label="평가 단계"><button type="button" data-stage="total" aria-pressed="true">전체 흐름</button><button type="button" data-stage="prepare" aria-pressed="false">준비</button><button type="button" data-stage="mapping" aria-pressed="false">매핑</button></div><span class="muted" id="cf-stage-note"></span></div>
        <div id="cf-overview" class="columns">
          <section><div class="section-head"><h2>품질</h2></div><div id="cf-quality"></div></section>
          <section><div class="section-head"><h2>성능</h2></div><div id="cf-performance"></div></section>
        </div>
        <section id="cf-fields" class="fields-page" aria-label="항목별 비교" hidden></section>
        <section class="detail" id="cf-tokens" hidden>
          <div class="section-head"><h3>토큰 사용량</h3><div class="stage" aria-label="토큰 측정 단계"><button type="button" data-stage="total" aria-pressed="true">전체 흐름</button><button type="button" data-stage="prepare" aria-pressed="false">준비</button><button type="button" data-stage="mapping" aria-pressed="false">매핑</button></div></div>
          <span class="muted" id="cf-token-caption"></span>
          <div id="cf-token-chart"></div>
          <details class="token-table"><summary>표로 보기</summary><div class="table-wrap"><table><thead><tr><th>모델</th><th>평균 입력 토큰</th><th>평균 출력 토큰</th><th>평균 합계 토큰</th><th>전체 사용 토큰</th><th>토큰 미관측 질문</th><th>평균 예상 비용 (USD)</th><th>전체 예상 비용 (USD)</th></tr></thead><tbody id="cf-token-body"></tbody></table></div></details>
        </section>
        <dialog id="cf-source" class="detail" aria-labelledby="cf-source-title"><div class="section-head"><h3 id="cf-source-title"></h3><button type="button" id="cf-source-close">닫기</button></div><div id="source-content"></div></dialog>
        <footer class="bottom"><span></span><button type="button" id="refresh">새로 고침</button><button type="button" id="logout" class="secondary">로그아웃</button></footer>
      </main>
    </div>
  </div>
</body>
</html>
