<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>입력칸 확인 로그인</title>
  <link rel="stylesheet" href="/quality/quality.css">
  <script type="module" src="/quality/login.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">CAREER FORM</p>
    <h1>입력칸 확인</h1>
    <p>팀 공용 비밀번호로 확인 목록에 접근합니다.</p>
    <form id="login-form">
      <label for="password">공용 비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" maxlength="1024" required>
      <button type="submit">로그인</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
