spring:
  application:
    name: career-form-backend
  mongodb:
    uri: ${SPRING_MONGODB_URI}
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
  ai:
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
    openai:
      api-key: ${OPENAI_API_KEY:}
      timeout: ${CAREER_FORM_LLM_TIMEOUT:30s}
      max-retries: 0
      chat:
        model: ${CAREER_FORM_LLM_MODEL:gpt-5.6-luna}
        reasoning-effort: none
        max-completion-tokens: ${CAREER_FORM_LLM_MAX_OUTPUT_TOKENS:8192}
        store: true
  threads:
    virtual:
      enabled: true

career-form:
  quality:
    enabled: ${CAREER_FORM_QUALITY_ENABLED:false}
    version: ${CAREER_FORM_QUALITY_VERSION:UNKNOWN}
    password-hash: ${CAREER_FORM_QUALITY_PASSWORD_HASH:}
    query-token-hash: ${CAREER_FORM_QUALITY_QUERY_TOKEN_HASH:}
    management-url: ${CAREER_FORM_QUALITY_MANAGEMENT_URL:}
    discord:
      enabled: ${CAREER_FORM_QUALITY_DISCORD_ENABLED:false}
      environment: ${CAREER_FORM_QUALITY_DISCORD_ENVIRONMENT:prod}
      webhook: ${CAREER_FORM_QUALITY_DISCORD_WEBHOOK:}
    selection:
      days: ${CAREER_FORM_QUALITY_SELECTION_DAYS:7}
      minimum-sample: ${CAREER_FORM_QUALITY_SELECTION_MINIMUM_SAMPLE:20}
  notification:
    enabled: ${CAREER_FORM_NOTIFICATION_ENABLED:false}
    push:
      dispatch-interval: ${CAREER_FORM_PUSH_DISPATCH_INTERVAL:60s}
      concurrency: ${CAREER_FORM_PUSH_CONCURRENCY:20}
      max-attempts: ${CAREER_FORM_PUSH_MAX_ATTEMPTS:8}
      lease: ${CAREER_FORM_PUSH_LEASE:120s}
      timeout: ${CAREER_FORM_PUSH_TIMEOUT:10s}
      allowed-endpoint-hosts: ${CAREER_FORM_PUSH_ALLOWED_ENDPOINT_HOSTS:fcm.googleapis.com,jmt17.google.com}
      vapid:
        public-key: ${CAREER_FORM_PUSH_VAPID_PUBLIC_KEY:}
        private-key: ${CAREER_FORM_PUSH_VAPID_PRIVATE_KEY:}
        subject: ${CAREER_FORM_PUSH_VAPID_SUBJECT:}
  tracing:
    langsmith:
      enabled: ${CAREER_FORM_LANGSMITH_ENABLED:false}
      api-key: ${LANGSMITH_API_KEY:}
      endpoint: ${LANGSMITH_ENDPOINT:https://api.smith.langchain.com}
      project: ${LANGSMITH_PROJECT:career-form}
      timeout-ms: ${CAREER_FORM_LANGSMITH_TIMEOUT_MS:1000}
      capacity: ${CAREER_FORM_LANGSMITH_CAPACITY:64}
  analysis:
    enabled: ${CAREER_FORM_ANALYSIS_ENABLED:}
    provider: ${CAREER_FORM_ANALYSIS_PROVIDER:jev}
    search-provider: ${CAREER_FORM_SEARCH_PROVIDER:}
    calendar-provider: ${CAREER_FORM_CALENDAR_PROVIDER:jev}
    jev:
      api-key: ${TYPESAFE_API_KEY:}
      model: ${CAREER_FORM_JEV_MODEL:jev-latest}
      timeout-ms: ${CAREER_FORM_JEV_TIMEOUT_MS:8000}
      min-confidence: ${CAREER_FORM_JEV_MIN_CONFIDENCE:0.8}
      data-policy-reviewed: ${CAREER_FORM_JEV_DATA_POLICY_REVIEWED:false}
      rate-limit-retries: ${CAREER_FORM_JEV_RATE_LIMIT_RETRIES:2}
      section-concurrency: ${CAREER_FORM_JEV_SECTION_CONCURRENCY:3}
      field-batch-size: ${CAREER_FORM_JEV_FIELD_BATCH_SIZE:5}
      max-concurrent: ${CAREER_FORM_JEV_MAX_CONCURRENT:10}
  llm:
    enabled: ${CAREER_FORM_LLM_ENABLED:}
  evaluation:
    # development 서버에서만 켠다. 사용자 요청과 서버 동시 호출 상한을 나눠 쓴다.
    enabled: ${CAREER_FORM_EVALUATION_ENABLED:false}
    # 배포 이미지가 담은 커밋(Dockerfile ARG). 비면 career-form.quality.version(이미지 digest, 로컬 버전)을 쓴다.
    commit: ${CAREER_FORM_COMMIT:}
    # 배포 이미지가 담은 공급자 연결 코드 지문(Dockerfile ARG). 바뀌면 자동 평가가 돈다.
    adapter-digest: ${CAREER_FORM_ADAPTER_DIGEST:}
    # 평가 기록 삭제. 함께 쓰는 서버의 기록은 팀의 변경 이력이라 기본은 끄고 로컬 실행기에서만 켠다.
    record-delete-enabled: ${CAREER_FORM_EVALUATION_RECORD_DELETE_ENABLED:false}
    max-model-calls-per-run: ${CAREER_FORM_EVALUATION_MAX_MODEL_CALLS:500}
    max-repetitions: ${CAREER_FORM_EVALUATION_MAX_REPETITIONS:20}
    poll-interval: ${CAREER_FORM_EVALUATION_POLL_INTERVAL:10s}
    lease: ${CAREER_FORM_EVALUATION_LEASE:5m}
    # 평가 입력(AI에 묻는 내용, 프롬프트, 설정, 공급자 연결 코드, 데이터셋)이 바뀐 채 배포되면 평가를 한 번 자동으로 돌린다.
    auto-run:
      enabled: ${CAREER_FORM_EVALUATION_AUTO_RUN_ENABLED:false}
      dataset-id: generic-matching
      # 평가 화면(static/evaluations/app.js의 DATASET)과 같은 버전이어야 한다.
      dataset-version: ${CAREER_FORM_EVALUATION_AUTO_RUN_DATASET_VERSION:4}
      repetitions: ${CAREER_FORM_EVALUATION_AUTO_RUN_REPETITIONS:3}
    # 평가에서만 고를 수 있는 OpenAI 공급자. 제품 공급자 선택(career-form.analysis.provider)과 무관하다.
    openai:
      enabled: ${CAREER_FORM_EVALUATION_OPENAI_ENABLED:false}
      api-key: ${CAREER_FORM_EVALUATION_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      # 쉼표로 구분한 허용 모델. 첫 모델이 기본값이다.
      models: ${CAREER_FORM_EVALUATION_OPENAI_MODELS:gpt-6-luna}
      reasoning-effort: ${CAREER_FORM_EVALUATION_OPENAI_REASONING_EFFORT:none}
      timeout-ms: ${CAREER_FORM_EVALUATION_OPENAI_TIMEOUT_MS:30000}
      rate-limit-retries: ${CAREER_FORM_EVALUATION_OPENAI_RATE_LIMIT_RETRIES:2}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-none}]"
  level:
    org.springframework.ai.openai.OpenAiChatModel: "OFF"

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      env: ${CAREER_FORM_ENV:${SPRING_PROFILES_ACTIVE:local}}
      service: career-form-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 2s,20s

springdoc:
  api-docs:
    enabled: false
    version: OPENAPI_3_0
  swagger-ui:
    enabled: false
