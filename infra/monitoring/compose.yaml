x-runtime: &runtime
  platform: linux/arm64
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  loki:
    <<: *runtime
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    mem_limit: 192m
    environment:
      GOMEMLIMIT: 150MiB
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - type: bind
        source: ./loki.yaml
        target: /etc/loki/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MONITORING_DATA_DIR:-/srv/career-form-monitoring}/loki
        target: /loki
        bind:
          create_host_path: false

  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    mem_limit: 192m
    environment:
      GOMEMLIMIT: 150MiB
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --web.enable-remote-write-receiver
      - --query.max-concurrency=2
    volumes:
      - type: bind
        source: ./prometheus.yaml
        target: /etc/prometheus/prometheus.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MONITORING_DATA_DIR:-/srv/career-form-monitoring}/prometheus
        target: /prometheus
        bind:
          create_host_path: false

  grafana:
    <<: *runtime
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    mem_limit: 192m
    environment:
      GOMEMLIMIT: 150MiB
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "false"
      GF_PLUGINS_PREINSTALL: ""
      GF_PLUGINS_PREINSTALL_SYNC: "yesoreyeram-infinity-datasource@4.1.1"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_SERVER_ROOT_URL: ${MONITORING_PUBLIC_URL:?MONITORING_PUBLIC_URL is required}
    env_file:
      - ${MONITORING_SECRETS_DIR:-/etc/career-form-monitoring/secrets}/grafana.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MONITORING_DATA_DIR:-/srv/career-form-monitoring}/grafana
        target: /var/lib/grafana
        bind:
          create_host_path: false
      - type: bind
        source: ${MONITORING_SECRETS_DIR:-/etc/career-form-monitoring/secrets}/grafana-password
        target: /run/secrets/grafana-password
        read_only: true
        bind:
          create_host_path: false

  ingest:
    <<: *runtime
    image: nginx:1.30-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    mem_limit: 32m
    command: ["nginx", "-g", "daemon off;"]
    entrypoint: []
    ports:
      - "${MONITORING_PRIVATE_IP:?MONITORING_PRIVATE_IP is required}:3100:3100"
      - "${MONITORING_PRIVATE_IP:?MONITORING_PRIVATE_IP is required}:9090:9090"
      - "80:80"
    volumes:
      - type: bind
        source: ./proxy.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ingest-allow.conf
        target: /etc/nginx/ingest-allow.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MONITORING_SECRETS_DIR:-/etc/career-form-monitoring/secrets}/ingest.htpasswd
        target: /etc/nginx/ingest.htpasswd
        read_only: true
        bind:
          create_host_path: false
    depends_on: [loki, prometheus]

  host-metrics:
    <<: *runtime
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    mem_limit: 96m
    environment:
      GOMEMLIMIT: 64MiB
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - type: bind
        source: ./alloy/monitoring.alloy
        target: /etc/alloy/config.alloy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MONITORING_DATA_DIR:-/srv/career-form-monitoring}/host-metrics
        target: /var/lib/alloy
        bind:
          create_host_path: false
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
