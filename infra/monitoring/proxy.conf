worker_processes 1;
events {
  worker_connections 128;
}
http {
  access_log off;
  error_log /dev/stderr warn;
  client_max_body_size 2m;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  server {
    listen 80;
    location / {
      set $grafana_backend grafana:3000;
      proxy_pass http://$grafana_backend$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
  server {
    listen 3100;
    auth_basic "career-form ingest";
    auth_basic_user_file /etc/nginx/ingest.htpasswd;
    include /etc/nginx/ingest-allow.conf;
    location = /loki/api/v1/push {
      limit_except POST { deny all; }
      set $loki_backend loki:3100;
      proxy_pass http://$loki_backend;
    }
    location / { return 404; }
  }
  server {
    listen 9090;
    auth_basic "career-form ingest";
    auth_basic_user_file /etc/nginx/ingest.htpasswd;
    include /etc/nginx/ingest-allow.conf;
    location = /api/v1/write {
      limit_except POST { deny all; }
      set $prometheus_backend prometheus:9090;
      proxy_pass http://$prometheus_backend;
    }
    location / { return 404; }
  }
}
