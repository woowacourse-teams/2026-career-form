services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be a digest-pinned image}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI:?SPRING_MONGODB_URI is required}
      CAREER_FORM_LLM_ENABLED: ${CAREER_FORM_LLM_ENABLED:-false}
      CAREER_FORM_QUALITY_ENABLED: ${CAREER_FORM_QUALITY_ENABLED:-false}
      CAREER_FORM_QUALITY_VERSION: ${BACKEND_IMAGE:?BACKEND_IMAGE must be a digest-pinned image}
      CAREER_FORM_QUALITY_PASSWORD_HASH: ${CAREER_FORM_QUALITY_PASSWORD_HASH:-}
      CAREER_FORM_QUALITY_QUERY_TOKEN_HASH: ${CAREER_FORM_QUALITY_QUERY_TOKEN_HASH:-}
      CAREER_FORM_QUALITY_MANAGEMENT_URL: ${CAREER_FORM_QUALITY_MANAGEMENT_URL:-}
      CAREER_FORM_QUALITY_DISCORD_ENABLED: ${CAREER_FORM_QUALITY_DISCORD_ENABLED:-false}
      CAREER_FORM_QUALITY_DISCORD_ENVIRONMENT: ${CAREER_FORM_QUALITY_DISCORD_ENVIRONMENT:-prod}
      CAREER_FORM_QUALITY_DISCORD_WEBHOOK: ${CAREER_FORM_QUALITY_DISCORD_WEBHOOK:-}
      CAREER_FORM_QUALITY_SELECTION_DAYS: ${CAREER_FORM_QUALITY_SELECTION_DAYS:-7}
      CAREER_FORM_QUALITY_SELECTION_MINIMUM_SAMPLE: ${CAREER_FORM_QUALITY_SELECTION_MINIMUM_SAMPLE:-20}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
    ports:
      - "127.0.0.1:${BACKEND_PORT:?BACKEND_PORT is required}:8080"
    expose:
      - "9091"
    labels:
      career-form.env: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}
      career-form.service: career-form-backend
      career-form.monitoring: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
