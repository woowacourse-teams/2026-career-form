name: 기술 작업
description: 리팩터링, 인프라, 하네스 변경을 제안합니다.
labels:
  - status:planning
  - type:technical
body:
  - type: markdown
    attributes:
      value: 실제 지원서 값, 계정 정보, 브라우저 세션 정보는 기록하지 않습니다. 비식별 처리한 구조와 검증 결과만 작성해 주세요.
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 현재 제약과 해결해야 할 기술 문제만 적습니다.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 완료 후 달라지는 속성과 결과만 적습니다.
    validations:
      required: true
  - type: textarea
    id: in-scope
    attributes:
      label: 포함 범위
      description: 실제로 변경할 시스템과 파일 영역을 적습니다.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 제외 범위
      description: 포함 범위로 오해할 수 있지만 다루지 않을 항목을 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 인수 조건
      description: 동작 또는 운영 속성을 체크리스트로 적습니다.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: automated-validation
    attributes:
      label: 자동 검증
      description: 실행할 테스트, 린트, 빌드와 정책 검사 명령을 적습니다.
    validations:
      required: true
  - type: textarea
    id: manual-validation
    attributes:
      label: 수동 검증
      description: 자동화할 수 없는 확인과 사람 담당 작업을 적습니다. 없으면 없음을 적습니다.
    validations:
      required: true
  - type: textarea
    id: risky-operations
    attributes:
      label: 위험 작업
      description: 실제 위험과 시크릿, 삭제, 마이그레이션, 배포의 사람 담당 경계를 적습니다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 문서
      description: 작업 판단에 사용한 설계 결정과 의존 Issue만 연결합니다.
