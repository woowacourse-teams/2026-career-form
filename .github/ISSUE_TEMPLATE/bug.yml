name: 버그 수정
description: 재현 가능한 잘못된 동작을 수정합니다.
labels:
  - status:planning
  - type:bug
body:
  - type: markdown
    attributes:
      value: 실제 지원서 값, 계정 정보, 브라우저 세션 정보는 기록하지 않습니다. 비식별 처리한 구조와 검증 결과만 작성해 주세요.
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 실제 동작, 기대 동작, 비식별 재현 조건을 적습니다.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 수정 후 보장할 동작을 적습니다.
    validations:
      required: true
  - type: textarea
    id: in-scope
    attributes:
      label: 포함 범위
      description: 원인 조사와 수정 범위를 적습니다.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 제외 범위
      description: 함께 고치지 않을 문제를 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 인수 조건
      description: 회귀 방지 결과를 체크리스트로 적습니다.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: automated-validation
    attributes:
      label: 자동 검증
      description: 재현 테스트와 회귀 테스트를 적습니다.
    validations:
      required: true
  - type: textarea
    id: manual-validation
    attributes:
      label: 수동 검증
      description: 사람이 확인할 항목을 적습니다. 없으면 없음을 적습니다.
    validations:
      required: true
  - type: textarea
    id: risky-operations
    attributes:
      label: 위험 작업
      description: 시크릿, 삭제, 마이그레이션, 배포 포함 여부를 적습니다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 문서
      description: 관련 로그는 개인정보와 시크릿을 제거한 뒤 연결합니다.
