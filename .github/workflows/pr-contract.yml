name: PR 계약

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: 연결 Issue 제목 수집
        if: startsWith(github.head_ref, 'CF-') || startsWith(github.head_ref, 'hotfix/CF-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_HEAD_REF" == hotfix/CF-* ]]; then
            issue_number="${GITHUB_HEAD_REF#hotfix/CF-}"
          else
            issue_number="${GITHUB_HEAD_REF#CF-}"
          fi
          gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json title > "$RUNNER_TEMP/linked-issue.json"
      - name: PR 계약 검사
        run: |
          if [[ -f "$RUNNER_TEMP/linked-issue.json" ]]; then
            python harness/scripts/validate-pr.py "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/linked-issue.json"
          else
            python harness/scripts/validate-pr.py "$GITHUB_EVENT_PATH"
          fi
