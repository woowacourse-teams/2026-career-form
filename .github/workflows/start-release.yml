name: 릴리스 시작

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release/<MAJOR.MINOR.PATCH>에 사용할 버전"
        required: true
        type: string
      ref:
        description: "release 기준 develop 커밋 SHA(비우면 develop HEAD)"
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: start-release
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
      - name: 버전과 활성 릴리스 확인
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version은 선행 0 없는 MAJOR.MINOR.PATCH 형식이어야 합니다" >&2
            exit 1
          fi
          if [[ -n "$(git ls-remote --heads origin 'refs/heads/release/*')" ]]; then
            echo "활성 release 브랜치는 하나만 허용됩니다" >&2
            exit 1
          fi
      - name: 기준 커밋 확인
        id: base
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          develop_sha="$(git rev-parse --verify origin/develop^{commit})"
          if [[ -z "$REF_INPUT" ]]; then
            release_sha="$develop_sha"
            source="develop HEAD"
          else
            ref="$(printf '%s' "$REF_INPUT" | tr 'A-F' 'a-f')"
            if [[ ! "$ref" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "ref는 7~40자리 커밋 SHA여야 합니다" >&2
              exit 1
            fi
            if ! release_sha="$(git rev-parse --verify --quiet "$ref^{commit}")"; then
              echo "ref에 해당하는 커밋이 없거나 하나로 정해지지 않습니다: $ref" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$release_sha" "$develop_sha"; then
              echo "ref 커밋이 develop 이력에 없습니다: $release_sha" >&2
              exit 1
            fi
            source="지정 커밋"
          fi
          {
            echo "sha=$release_sha"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"
      - name: 릴리스 브랜치와 Draft PR 생성
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ steps.base.outputs.sha }}
          BASE_SOURCE: ${{ steps.base.outputs.source }}
        run: |
          set -euo pipefail
          branch="release/$VERSION"
          git switch --create "$branch" "$RELEASE_SHA"
          git push origin "$branch"
          body="$RUNNER_TEMP/release-pr.md"
          printf '%s\n' \
            '## 무엇이 바뀌었나요?' \
            "release/$VERSION 후보를 스테이징에서 고정 검증하고 운영에 반영합니다." \
            '## 왜 바꿨나요?' \
            '다음 develop 작업과 현재 릴리스 후보 검증을 분리해야 합니다.' \
            '## 어떻게 바꿨나요?' \
            "$BASE_SOURCE \`$RELEASE_SHA\`에서 release/$VERSION 브랜치와 Draft PR을 생성했습니다." \
            '## 기존 기능에 미치는 영향' \
            '검증된 release digest만 운영 배포 대상으로 승격됩니다.' \
            '## 검토한 대안과 선택 이유' \
            'develop 직접 승격 대신 고정된 release 브랜치를 선택했습니다.' \
            '## 리뷰 포인트' \
            '스테이징 digest와 운영 승격 digest가 동일한지 확인합니다. 검증 실패 시 release 브랜치에서 수정하고 다시 검증합니다.' \
            '' \
            '<details>' \
            '<summary>검증 기록</summary>' \
            '' \
            '### 자동 검증' \
            '생성 시점에는 릴리스 검증을 완료하지 않았습니다. CI와 스테이징 배포 결과를 확인한 뒤 기록합니다.' \
            '' \
            '### 수동 검증' \
            '스테이징 E2E는 아직 수행하지 않았습니다. 사람이 확인 결과와 최종 승인 여부를 기록합니다.' \
            '' \
            '</details>' \
            > "$body"
          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "[Release] $VERSION 운영 반영" \
            --body-file "$body"
          gh workflow run deploy-staging.yml \
            --ref "$branch"
