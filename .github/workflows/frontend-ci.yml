name: 프론트엔드 CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트엔드 의존성 설치
        run: npm ci
      - name: Chromium과 시스템 의존성 설치
        run: npm exec -- playwright install --with-deps chromium
      - name: 실행 환경 확인
        run: |
          node --version
          npm --version
          npm exec -- playwright --version
          node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); console.log("Chromium", browser.version()); await browser.close();'
          uname -sr
      - name: 단위 및 브라우저 테스트와 통합 커버리지 검증
        run: npm run coverage
