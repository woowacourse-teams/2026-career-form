name: 프론트엔드 CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: 테스트 shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트엔드 의존성 설치
        run: npm ci
      - name: Chromium과 시스템 의존성 설치
        run: npm exec -- playwright install --with-deps chromium
      - name: 실행 환경 확인
        run: |
          node --version
          npm --version
          npm exec -- playwright --version
          node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); console.log("Chromium", browser.version()); await browser.close();'
          uname -sr
          nproc
      - name: 단위 및 브라우저 테스트 shard 실행
        run: npm run coverage:shard -- --shard=${{ matrix.shard }}/3
      - name: shard 보고서 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: 통합 커버리지 검증
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트엔드 의존성 설치
        run: npm ci
      - name: shard 보고서 다운로드
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: frontend/.vitest-reports/
          merge-multiple: true
      - name: shard 보고서 수 확인
        run: |
          ls -l .vitest-reports
          test "$(find .vitest-reports -name 'blob-*-3.json' | wc -l)" -eq 3
      - name: 병합 결과의 테스트, 브라우저 수집과 커버리지 기준 검증
        run: npm run coverage:merge
