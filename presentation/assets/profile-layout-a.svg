<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">프로필 관리 A형</title><desc id="desc">왼쪽 범주 메뉴와 오른쪽 집중 폼을 사용하는 넓은 프로필 화면</desc>
  <style>text { font-family: "Pretendard Variable", Pretendard, Arial, sans-serif; }</style>
  <rect width="1440" height="900" fill="#F6F9FC"/><text x="90" y="70" fill="#2196F3" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">CAREER FORM</text><text x="90" y="116" fill="#0D47A1" font-family="Arial,sans-serif" font-size="38" font-weight="700">프로필 관리</text><text x="90" y="148" fill="#526272" font-family="Arial,sans-serif" font-size="14">필요한 정보만 입력하세요. 변경 내용은 자동 저장됩니다.</text>
  <rect x="1110" y="78" width="146" height="46" rx="23" fill="#FFFFFF" stroke="#D6E0E8"/><rect x="1116" y="84" width="65" height="34" rx="17" fill="#0D47A1"/><text x="1148" y="106" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="12" font-weight="700">A형</text><text x="1215" y="106" text-anchor="middle" fill="#526272" font-family="Arial,sans-serif" font-size="12" font-weight="700">B형</text><circle cx="1280" cy="101" r="5" fill="#18794E"/><text x="1294" y="106" fill="#526272" font-family="Arial,sans-serif" font-size="12">저장됨</text>
  <rect x="90" y="180" width="1260" height="48" rx="12" fill="#E3F2FD" stroke="#90CAF9"/><text x="112" y="210" fill="#0D47A1" font-family="Arial,sans-serif" font-size="12">프로필은 암호화 없이 Chrome 로컬 저장소에 보관됩니다.</text>
  <rect x="90" y="252" width="270" height="572" rx="16" fill="#FFFFFF" stroke="#D6E0E8"/><g font-family="Arial,sans-serif" font-size="14" font-weight="700"><rect x="106" y="270" width="238" height="46" rx="10" fill="#E3F2FD"/><text x="128" y="298" fill="#2196F3" font-size="10">01</text><text x="166" y="299" fill="#0D47A1">기본 인적사항</text><text x="128" y="348" fill="#2196F3" font-size="10">02</text><text x="166" y="349" fill="#263442">연락처와 주소</text><text x="128" y="398" fill="#2196F3" font-size="10">03</text><text x="166" y="399" fill="#263442">학력</text><text x="128" y="448" fill="#2196F3" font-size="10">04</text><text x="166" y="449" fill="#263442">어학</text><text x="128" y="498" fill="#2196F3" font-size="10">05</text><text x="166" y="499" fill="#263442">자격증, 면허증</text><text x="128" y="548" fill="#2196F3" font-size="10">06</text><text x="166" y="549" fill="#263442">프로젝트</text><text x="128" y="598" fill="#2196F3" font-size="10">07</text><text x="166" y="599" fill="#263442">병역</text><text x="128" y="648" fill="#2196F3" font-size="10">08</text><text x="166" y="649" fill="#263442">보훈</text><text x="128" y="698" fill="#2196F3" font-size="10">09</text><text x="166" y="699" fill="#263442">장애</text><text x="128" y="748" fill="#2196F3" font-size="10">10</text><text x="166" y="749" fill="#263442">건강</text></g>
  <rect x="384" y="252" width="966" height="572" rx="16" fill="#FFFFFF" stroke="#D6E0E8"/><text x="430" y="298" fill="#2196F3" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">프로필 정보</text><text x="430" y="334" fill="#0D47A1" font-family="Arial,sans-serif" font-size="26" font-weight="700">기본 인적사항</text><line x1="430" y1="362" x2="1304" y2="362" stroke="#D6E0E8"/>
  <g font-family="Arial,sans-serif"><text x="430" y="407" fill="#263442" font-size="12" font-weight="700">국문 성</text><rect x="430" y="422" width="260" height="46" rx="9" fill="#FFFFFF" stroke="#90CAF9"/><text x="716" y="407" fill="#263442" font-size="12" font-weight="700">국문 이름</text><rect x="716" y="422" width="260" height="46" rx="9" fill="#FFFFFF" stroke="#D6E0E8"/><text x="1002" y="407" fill="#263442" font-size="12" font-weight="700">생년월일</text><rect x="1002" y="422" width="260" height="46" rx="9" fill="#FFFFFF" stroke="#D6E0E8"/>
  <text x="430" y="517" fill="#263442" font-size="12" font-weight="700">한자 성</text><rect x="430" y="532" width="260" height="46" rx="9" fill="#FFFFFF" stroke="#D6E0E8"/><text x="716" y="517" fill="#263442" font-size="12" font-weight="700">한자 이름</text><rect x="716" y="532" width="260" height="46" rx="9" fill="#FFFFFF" stroke="#D6E0E8"/><text x="1002" y="517" fill="#263442" font-size="12" font-weight="700">국적</text><rect x="1002" y="532" width="260" height="46" rx="9" fill="#FFFFFF" stroke="#D6E0E8"/>
  <text x="430" y="627" fill="#263442" font-size="12" font-weight="700">영문 성</text><rect x="430" y="642" width="403" height="46" rx="9" fill="#FFFFFF" stroke="#D6E0E8"/><text x="859" y="627" fill="#263442" font-size="12" font-weight="700">영문 이름</text><rect x="859" y="642" width="403" height="46" rx="9" fill="#FFFFFF" stroke="#D6E0E8"/></g>
  <rect x="430" y="730" width="832" height="54" rx="10" fill="#F4F7FA"/><text x="450" y="762" fill="#526272" font-family="Arial,sans-serif" font-size="12">모든 항목은 선택 입력이며, 원문의 의미를 바꾸지 않고 저장합니다.</text>
</svg>
