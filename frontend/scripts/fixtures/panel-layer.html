<!doctype html>
<meta charset="utf-8" />
<title>Synthetic panel stacking fixture</title>
<style>
  body {
    min-height: 2400px;
  }
  #outside {
    position: fixed;
    top: 0;
    left: 0;
    padding: 8px;
  }
  @keyframes page-layer {
    from {
      opacity: 0.99;
    }
    to {
      opacity: 1;
    }
  }
  #page-layer {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    transform: translateZ(0);
    pointer-events: none;
    animation: page-layer 300ms infinite alternate;
  }
  #page-layer button {
    position: absolute;
    right: 20px;
    top: 80px;
    width: min(380px, calc(100vw - 40px));
    height: calc(100vh - 100px);
    pointer-events: auto;
  }
</style>
<button id="outside" type="button">Outside</button>
<dialog id="page-dialog">
  <button id="dialog-close" type="button">Close page dialog</button>
</dialog>
<script>
  // Only extension runtime/storage boundaries are replaced. The panel and WXT
  // shadow host below come from the unmodified production build.
  const listeners = [];
  const fixture = { outsideClicks: 0, errors: [] };
  window.fixture = fixture;
  addEventListener("error", (event) => fixture.errors.push(event.message));
  addEventListener("unhandledrejection", (event) =>
    fixture.errors.push(String(event.reason)),
  );
  document.querySelector("#outside").onclick = () => fixture.outsideClicks++;
  document.querySelector("#dialog-close").onclick = () =>
    document.querySelector("#page-dialog").close();
  let profile = {
    personal: {
      koreanFamilyName: "김",
      koreanGivenName: "합성 테스트",
      hanjaFamilyName: "金",
      hanjaGivenName: "合成",
      englishFamilyName: "SYNTHETIC",
      englishGivenName: "FIXTURE NAME",
      gender: "선택 안 함",
      birthDate: "2000-01-02",
      nationality: "대한민국",
    },
    contact: {
      email: "fixture@example.test",
      phoneNumber: "010-0000-0000",
      postalCode: "00000",
      addressLine1: "합성 테스트 주소",
      addressLine2: "합성 테스트 상세주소",
    },
    education: [],
    languages: [],
    certifications: [],
    careers: [],
    projects: [],
    publications: [],
    compensation: {},
    military: {},
    veteran: {},
    disability: {},
    health: [],
  };
  const runtime = {
    id: "synthetic-panel-fixture",
    getURL: (path) => `${location.origin}/bundle/${path.replace(/^\//, "")}`,
    onMessage: {
      addListener: (listener) => listeners.push(listener),
      removeListener: (listener) =>
        listeners.splice(listeners.indexOf(listener), 1),
    },
    async sendMessage() {
      return {};
    },
  };
  window.chrome = window.browser = {
    runtime,
    storage: {
      local: {
        async get() {
          return { "careerForm.profile": { schemaVersion: 1, profile } };
        },
        async set(values) {
          if (values["careerForm.profile"])
            profile = structuredClone(values["careerForm.profile"].profile);
        },
      },
      onChanged: { addListener() {}, removeListener() {} },
    },
  };
  fixture.ready = () => listeners.length > 0;
  fixture.open = async () => {
    for (const listener of listeners)
      await listener({ type: "career-form:open-in-page-profile-panel" });
  };
  fixture.host = () => document.querySelector("career-form-profile-panel");
  fixture.closeButton = () =>
    fixture.host()?.shadowRoot?.querySelector('button[aria-label="닫기"]');
  fixture.panelRoot = () => fixture.host()?.shadowRoot;
  fixture.resolveExtensionImages = () => {
    // A regular-page harness has no registered extension origin. Route only
    // its synthetic packaged images through the same actual-bundle server.
    const prefix = `chrome-extension://${runtime.id}/`;
    for (const image of fixture.panelRoot().querySelectorAll("img"))
      if (image.src.startsWith(prefix))
        image.src = runtime.getURL(image.src.slice(prefix.length));
  };
  fixture.main = () =>
    fixture.panelRoot()?.querySelector('main[aria-label="지원 정보 목록"]');
  fixture.fieldRow = (label) =>
    [...fixture.panelRoot().querySelectorAll("article")].find(
      (row) => row.querySelector("strong")?.textContent === label,
    );
  fixture.editButton = (label) =>
    fixture
      .fieldRow(label)
      ?.querySelector(`button[aria-label="${label} 수정"]`);
  fixture.editor = () =>
    fixture.panelRoot()?.querySelector('form[aria-label="기본 인적사항 수정"]');
  fixture.editorAction = (label) =>
    [...fixture.editor().querySelectorAll("button")].find(
      (button) => button.textContent === label,
    );
  fixture.settle = () =>
    new Promise((resolve) =>
      requestAnimationFrame(() => requestAnimationFrame(resolve)),
    );
  fixture.positionField = (label) => {
    window.scrollTo(0, 240);
    const main = fixture.main();
    main.scrollTop +=
      fixture.fieldRow(label).getBoundingClientRect().top -
      main.getBoundingClientRect().top -
      84;
  };
  fixture.geometry = (label) => {
    const main = fixture.main();
    const row = fixture.fieldRow(label);
    const rect = row.getBoundingClientRect();
    const next = row.nextElementSibling?.getBoundingClientRect();
    const input = fixture.editor()?.querySelector("input");
    const inputRect = input?.getBoundingClientRect();
    const actionRects = [
      ...(fixture.editor()?.querySelectorAll("button") ?? []),
    ].map((button) => button.getBoundingClientRect());
    return {
      pageX: window.scrollX,
      pageY: window.scrollY,
      mainX: main.scrollLeft,
      mainY: main.scrollTop,
      rowTop: rect.top,
      rowHeight: rect.height,
      nextTop: next?.top,
      horizontalOverflow:
        main.scrollWidth > main.clientWidth ||
        row.scrollWidth > row.clientWidth,
      controlsFit:
        !inputRect ||
        (inputRect.width >= 60 &&
          inputRect.left >= rect.left &&
          actionRects.every(
            (action) =>
              action.right <= rect.right &&
              Math.abs(action.top - inputRect.top) <= 1 &&
              Math.abs(action.bottom - inputRect.bottom) <= 1,
          )),
    };
  };
  fixture.center = (element) => {
    const rect = element.getBoundingClientRect();
    return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  };
  fixture.panelWins = () => {
    const point = fixture.center(fixture.closeButton());
    return document.elementFromPoint(point.x, point.y) === fixture.host();
  };
  fixture.addPageLayer = () => {
    const layer = document.createElement("div");
    layer.id = "page-layer";
    layer.innerHTML = '<button type="button">Ordinary page content</button>';
    document.body.append(layer);
  };
</script>
<script src="/bundle/content-scripts/autofill.js"></script>
