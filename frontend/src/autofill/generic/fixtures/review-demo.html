<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>합성 범용 검토 화면 데모</title>
    <style>
      body { font-family: sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
      fieldset { margin: 0 0 16px; }
      label { display: block; margin: 8px 0; }
    </style>
  </head>
  <body>
    <!-- 비식별 합성 문서. 실제 지원서 구조를 복사하지 않는다. 지원서는 제출되지 않는다. -->
    <h1>합성 지원 양식</h1>
    <form onsubmit="return false">
      <fieldset>
        <legend>인적사항</legend>
        <!-- AUTO: 이름과 이메일은 저장된 프로필에 직접 연결된다. -->
        <label>이름 <input name="synthetic-name" type="text" /></label>
        <label>이메일 <input name="synthetic-email" type="email" /></label>
      </fieldset>
      <fieldset>
        <legend>연락처</legend>
        <!-- 입력 불가 후보: 지원자가 아닌 다른 사람의 연락처다. -->
        <label>추천인 연락처 <input name="synthetic-referee-phone" type="tel" /></label>
        <!-- 확인 필요 후보: 칸 이름이 모호해 확신이 낮다. -->
        <label>정보 <input name="synthetic-vague" type="text" /></label>
      </fieldset>
      <fieldset>
        <legend>기타</legend>
        <!-- 입력 불가: 저장된 정보와 연결할 항목이 없다. -->
        <label>좋아하는 색 <input name="synthetic-color" type="text" /></label>
      </fieldset>
      <fieldset>
        <legend>제출</legend>
        <!-- 수집에서 제외되는 동의, 파일, 제출 컨트롤은 검토 목록에 나타나지 않는다. -->
        <label><input name="synthetic-consent" type="checkbox" /> 개인정보 수집에 동의합니다</label>
        <label>첨부 파일 <input name="synthetic-file" type="file" /></label>
        <button type="submit">제출하기</button>
      </fieldset>
    </form>
  </body>
</html>
