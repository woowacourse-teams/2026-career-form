<section data-fixture="calendar-hidden-aria-linked">
  <input id="start-month" type="text" readonly aria-label="Start month" />
  <button
    type="button"
    aria-labelledby="start-month"
    aria-controls="month-picker"
  >
    Choose month
  </button>
  <div id="month-picker" role="dialog" hidden>
    <button type="button">2026</button>
    <button type="button">January</button
    ><button type="button">February</button> <button type="button">March</button
    ><button type="button">April</button> <button type="button">May</button
    ><button type="button">June</button> <button type="button">July</button
    ><button type="button">August</button>
    <button type="button">September</button
    ><button type="button">October</button>
    <button type="button">November</button
    ><button type="button">December</button>
  </div>
</section>
