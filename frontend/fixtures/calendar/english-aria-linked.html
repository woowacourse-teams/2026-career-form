<input id="start-month" type="text" readonly aria-label="Start month" />
<button
  type="button"
  aria-labelledby="start-month"
  aria-controls="month-picker"
>
  Choose month
</button>
<div id="month-picker" role="dialog" data-calendar>
  <button type="button">2026</button>
  <button type="button">January</button><button type="button">February</button>
</div>
