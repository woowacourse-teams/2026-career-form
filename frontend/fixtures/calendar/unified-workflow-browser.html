<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CF-117 unified workflow fixture</title>
    <style>
      body {
        font: 16px/1.5 sans-serif;
        max-width: 960px;
        margin: 2rem auto;
      }
      main {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) minmax(320px, 420px);
        gap: 2rem;
      }
      section {
        margin-bottom: 1rem;
      }
      input {
        display: block;
        min-width: 16rem;
        margin-top: 0.25rem;
        padding: 0.4rem;
      }
      [role="dialog"] {
        padding: 0.75rem;
        border: 1px solid #999;
      }
      [role="dialog"] button {
        margin: 0.15rem;
      }
      #workflow-root {
        border: 1px solid #ddd;
        min-height: 32rem;
      }
      output {
        display: block;
        margin-top: 1rem;
        padding: 0.75rem;
        background: #f4f4f4;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main data-cf117-synthetic-fixture>
      <div>
        <h1>CF-117 synthetic mixed execution</h1>
        <p>비식별 로컬 fixture입니다. 저장, 이동, 제출 동작이 없습니다.</p>
        <section>
          <label for="synthetic-name">이름</label>
          <input id="synthetic-name" name="applicantName" type="text" />
        </section>
        <section>
          <label for="synthetic-start">입학 연월</label>
          <input id="synthetic-start" name="startMonth" type="text" readonly />
          <button
            type="button"
            aria-labelledby="synthetic-start"
            aria-controls="synthetic-calendar"
          >
            월 선택
          </button>
          <div id="synthetic-calendar" role="dialog" hidden>
            <button type="button">2026</button>
            <div id="synthetic-months"></div>
          </div>
        </section>
        <output id="fixture-result" role="status"
          >ordinary=empty, date=empty</output
        >
      </div>
      <div
        id="workflow-root"
        aria-label="Career Form production workflow"
      ></div>
    </main>
    <script type="module" src="./unified-workflow-browser.tsx"></script>
  </body>
</html>
