<script>
(function () {
  "use strict";
  // Each add button appends one empty copy of its group's first row right after
  // the group's last row. Dynamic ids are fixed per group and addition order:
  // education c132-c140 then c141-c149, career c150-c159. The button is
  // disabled once its fixed rows are used up.
  var buttons = document.querySelectorAll("button.add[data-group]");
  Array.prototype.forEach.call(buttons, function (button) {
    var group = button.getAttribute("data-group");
    var starts = button.getAttribute("data-id-starts").split(" ").map(Number);
    var added = 0;
    button.addEventListener("click", function () {
      if (added >= starts.length) return;
      var rows = button.parentElement.querySelectorAll(
        '.repeat-row[data-row="' + group + '"]'
      );
      var row = rows[0].cloneNode(true);
      var rowNumber = rows.length + 1;
      var controls = row.querySelectorAll("input, select, textarea");
      Array.prototype.forEach.call(controls, function (control, index) {
        var id = "c" + String(starts[added] + index).padStart(3, "0");
        var label = row.querySelector('label[for="' + control.id + '"]');
        if (label) label.htmlFor = id;
        control.id = id;
        control.name = control.name.replace(/-\d+$/, "-" + rowNumber);
        if (control.tagName === "SELECT") control.selectedIndex = 0;
        else control.value = "";
      });
      rows[rows.length - 1].after(row);
      added += 1;
      if (added >= starts.length) button.disabled = true;
    });
  });
})();
</script>
</body>
</html>
