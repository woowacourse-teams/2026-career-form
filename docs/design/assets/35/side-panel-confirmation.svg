<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900" role="img" aria-labelledby="title desc"><title id="title">자동 기입 최종 승인</title><desc id="desc">변경 항목 수와 제출 금지 경계를 확인하는 패널</desc>
  <rect width="560" height="900" fill="#F6F9FC"/><rect x="42" y="28" width="476" height="844" rx="22" fill="#FFFFFF" stroke="#D6E0E8"/>
  <text x="74" y="82" fill="#2196F3" font-family="Arial,sans-serif" font-size="11" font-weight="700">3 / 4</text><text x="74" y="120" fill="#0D47A1" font-family="Arial,sans-serif" font-size="26" font-weight="700">최종 승인</text>
  <rect x="74" y="164" width="412" height="156" rx="20" fill="#E3F2FD"/><circle cx="280" cy="212" r="22" fill="#0D47A1"/><path d="m270 212 7 7 14-17" fill="none" stroke="#FFFFFF" stroke-width="4"/><text x="280" y="268" text-anchor="middle" fill="#0D47A1" font-family="Arial,sans-serif" font-size="28" font-weight="700">N개 항목</text><text x="280" y="294" text-anchor="middle" fill="#526272" font-family="Arial,sans-serif" font-size="12">사용자가 선택한 값만 변경합니다.</text>
  <text x="74" y="372" fill="#263442" font-family="Arial,sans-serif" font-size="15" font-weight="700">Career Form이 하지 않는 일</text>
  <g font-family="Arial,sans-serif" font-size="13" fill="#526272"><circle cx="88" cy="410" r="4" fill="#2196F3"/><text x="104" y="415">지원서 저장을 실행하지 않음</text><circle cx="88" cy="450" r="4" fill="#2196F3"/><text x="104" y="455">다음 단계와 미리보기로 이동하지 않음</text><circle cx="88" cy="490" r="4" fill="#2196F3"/><text x="104" y="495">최종 제출을 실행하지 않음</text></g>
  <rect x="74" y="548" width="412" height="76" rx="12" fill="#FFFFFF" stroke="#90CAF9"/><text x="96" y="580" fill="#0D47A1" font-family="Arial,sans-serif" font-size="13" font-weight="700">개별 확인 항목</text><text x="96" y="604" fill="#526272" font-family="Arial,sans-serif" font-size="12">민감정보와 기존 값 덮어쓰기는 별도로 표시합니다.</text>
  <rect x="74" y="748" width="196" height="52" rx="10" fill="#FFFFFF" stroke="#2196F3"/><text x="172" y="781" text-anchor="middle" fill="#0D47A1" font-family="Arial,sans-serif" font-size="14" font-weight="700">검토로 돌아가기</text><rect x="290" y="748" width="196" height="52" rx="10" fill="#0D47A1"/><text x="388" y="781" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="14" font-weight="700">기입하기</text>
</svg>
