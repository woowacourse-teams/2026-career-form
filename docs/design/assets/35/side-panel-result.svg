<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900" role="img" aria-labelledby="title desc"><title id="title">자동 기입 결과 요약</title><desc id="desc">성공, 실패와 직접 확인 필요 항목을 구분하는 패널</desc>
  <rect width="560" height="900" fill="#F6F9FC"/><rect x="42" y="28" width="476" height="844" rx="22" fill="#FFFFFF" stroke="#D6E0E8"/>
  <text x="74" y="82" fill="#2196F3" font-family="Arial,sans-serif" font-size="11" font-weight="700">완료</text><text x="74" y="120" fill="#0D47A1" font-family="Arial,sans-serif" font-size="26" font-weight="700">기입 결과</text>
  <rect x="74" y="166" width="196" height="146" rx="18" fill="#E3F2FD"/><text x="172" y="230" text-anchor="middle" fill="#0D47A1" font-family="Arial,sans-serif" font-size="36" font-weight="700">N</text><text x="172" y="270" text-anchor="middle" fill="#526272" font-family="Arial,sans-serif" font-size="12">기입 성공</text>
  <rect x="290" y="166" width="196" height="146" rx="18" fill="#FFFFFF" stroke="#D6E0E8"/><text x="388" y="230" text-anchor="middle" fill="#0D47A1" font-family="Arial,sans-serif" font-size="36" font-weight="700">1</text><text x="388" y="270" text-anchor="middle" fill="#526272" font-family="Arial,sans-serif" font-size="12">직접 확인 필요</text>
  <text x="74" y="366" fill="#263442" font-family="Arial,sans-serif" font-size="15" font-weight="700">항목별 결과</text>
  <g font-family="Arial,sans-serif"><rect x="74" y="390" width="412" height="72" rx="12" fill="#FFFFFF" stroke="#D6E0E8"/><circle cx="102" cy="426" r="11" fill="#18794E"/><path d="m96 426 4 4 8-10" fill="none" stroke="#FFFFFF" stroke-width="2"/><text x="126" y="422" fill="#263442" font-size="13" font-weight="700">이메일주소</text><text x="126" y="443" fill="#526272" font-size="11">기입 성공</text>
  <rect x="74" y="476" width="412" height="72" rx="12" fill="#FFFFFF" stroke="#D6E0E8"/><circle cx="102" cy="512" r="11" fill="#C62828"/><text x="102" y="516" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">!</text><text x="126" y="508" fill="#263442" font-size="13" font-weight="700">확인 필요 항목</text><text x="126" y="529" fill="#526272" font-size="11">직접 입력 또는 값 확인</text></g>
  <rect x="74" y="584" width="412" height="76" rx="12" fill="#E3F2FD" stroke="#90CAF9"/><text x="96" y="617" fill="#0D47A1" font-family="Arial,sans-serif" font-size="13" font-weight="700">지원서의 실제 값을 직접 확인해 주세요.</text><text x="96" y="641" fill="#526272" font-family="Arial,sans-serif" font-size="11">Career Form은 저장하거나 제출하지 않습니다.</text>
  <rect x="74" y="742" width="412" height="52" rx="10" fill="#0D47A1"/><text x="280" y="775" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="15" font-weight="700">수동 복사로 돌아가기</text><text x="280" y="828" text-anchor="middle" fill="#0D47A1" font-family="Arial,sans-serif" font-size="12" font-weight="700">예외 상태 보기</text>
</svg>
