<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">프로필 관리 B형</title><desc id="desc">핵심 열 범주를 accordion으로 접고 펼치는 넓은 프로필 화면</desc>
  <rect width="1440" height="900" fill="#F6F9FC"/><text x="160" y="70" fill="#2196F3" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">CAREER FORM</text><text x="160" y="116" fill="#0D47A1" font-family="Arial,sans-serif" font-size="38" font-weight="700">프로필 관리</text><text x="160" y="148" fill="#526272" font-family="Arial,sans-serif" font-size="14">범주를 펼쳐 한 흐름으로 입력하는 B형 레이아웃</text>
  <rect x="1030" y="78" width="146" height="46" rx="23" fill="#FFFFFF" stroke="#D6E0E8"/><text x="1068" y="106" text-anchor="middle" fill="#526272" font-family="Arial,sans-serif" font-size="12" font-weight="700">A형</text><rect x="1099" y="84" width="71" height="34" rx="17" fill="#0D47A1"/><text x="1134" y="106" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="12" font-weight="700">B형</text><circle cx="1200" cy="101" r="5" fill="#18794E"/><text x="1214" y="106" fill="#526272" font-family="Arial,sans-serif" font-size="12">저장됨</text>
  <rect x="160" y="180" width="1120" height="48" rx="12" fill="#E3F2FD" stroke="#90CAF9"/><text x="182" y="210" fill="#0D47A1" font-family="Arial,sans-serif" font-size="12">프로필 데이터와 자동 저장 규칙은 A형과 같습니다.</text>
  <g font-family="Arial,sans-serif"><rect x="160" y="252" width="1120" height="264" rx="16" fill="#FFFFFF" stroke="#90CAF9"/><rect x="160" y="252" width="1120" height="66" rx="16" fill="#E3F2FD"/><text x="188" y="292" fill="#2196F3" font-size="11" font-weight="700">01</text><text x="232" y="293" fill="#0D47A1" font-size="18" font-weight="700">기본 인적사항</text><path d="m1242 278-10 10-10-10" fill="none" stroke="#0D47A1" stroke-width="2"/>
  <text x="198" y="360" fill="#263442" font-size="12" font-weight="700">국문 성</text><rect x="198" y="375" width="316" height="46" rx="9" fill="#FFFFFF" stroke="#90CAF9"/><text x="542" y="360" fill="#263442" font-size="12" font-weight="700">국문 이름</text><rect x="542" y="375" width="316" height="46" rx="9" fill="#FFFFFF" stroke="#D6E0E8"/><text x="886" y="360" fill="#263442" font-size="12" font-weight="700">생년월일</text><rect x="886" y="375" width="316" height="46" rx="9" fill="#FFFFFF" stroke="#D6E0E8"/><text x="198" y="462" fill="#526272" font-size="12">같은 범주 안의 나머지 필드가 이어집니다.</text>
  <rect x="160" y="534" width="1120" height="70" rx="14" fill="#FFFFFF" stroke="#D6E0E8"/><text x="188" y="575" fill="#2196F3" font-size="11" font-weight="700">02</text><text x="232" y="576" fill="#263442" font-size="17" font-weight="700">연락처와 주소</text><path d="m1222 560 10 10 10-10" fill="none" stroke="#526272" stroke-width="2"/>
  <rect x="160" y="620" width="1120" height="70" rx="14" fill="#FFFFFF" stroke="#D6E0E8"/><text x="188" y="661" fill="#2196F3" font-size="11" font-weight="700">03</text><text x="232" y="662" fill="#263442" font-size="17" font-weight="700">학력</text><rect x="1088" y="642" width="104" height="28" rx="14" fill="#E3F2FD"/><text x="1140" y="661" text-anchor="middle" fill="#0D47A1" font-size="10" font-weight="700">여러 건 추가</text><path d="m1222 646 10 10 10-10" fill="none" stroke="#526272" stroke-width="2"/>
  <rect x="160" y="706" width="1120" height="70" rx="14" fill="#FFFFFF" stroke="#D6E0E8"/><text x="188" y="747" fill="#2196F3" font-size="11" font-weight="700">04</text><text x="232" y="748" fill="#263442" font-size="17" font-weight="700">어학</text><rect x="1088" y="728" width="104" height="28" rx="14" fill="#E3F2FD"/><text x="1140" y="747" text-anchor="middle" fill="#0D47A1" font-size="10" font-weight="700">여러 건 추가</text><path d="m1222 732 10 10 10-10" fill="none" stroke="#526272" stroke-width="2"/>
  <rect x="160" y="792" width="1120" height="70" rx="14" fill="#FFFFFF" stroke="#D6E0E8"/><text x="188" y="833" fill="#2196F3" font-size="11" font-weight="700">05–10</text><text x="252" y="834" fill="#263442" font-size="17" font-weight="700">자격증 · 프로젝트 · 병역 · 보훈 · 장애 · 건강</text><text x="1178" y="834" text-anchor="end" fill="#526272" font-size="11">아래로 계속</text></g>
</svg>
