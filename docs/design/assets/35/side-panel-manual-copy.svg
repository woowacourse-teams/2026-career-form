<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900" role="img" aria-labelledby="title desc">
  <title id="title">사이드 패널 프로필 탐색과 수동 복사</title><desc id="desc">검색, 일반 값 복사와 민감정보 개별 펼침을 제공하는 패널</desc>
  <rect width="560" height="900" fill="#F6F9FC"/><rect x="42" y="28" width="476" height="844" rx="22" fill="#FFFFFF" stroke="#D6E0E8"/>
  <text x="74" y="70" fill="#2196F3" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">CAREER FORM</text><text x="74" y="100" fill="#0D47A1" font-family="Arial,sans-serif" font-size="24" font-weight="700">내 프로필</text>
  <rect x="420" y="68" width="66" height="28" rx="14" fill="#E3F2FD"/><text x="453" y="87" text-anchor="middle" fill="#0D47A1" font-family="Arial,sans-serif" font-size="11" font-weight="700">N개 값</text>
  <line x1="42" y1="124" x2="518" y2="124" stroke="#D6E0E8"/>
  <text x="74" y="158" fill="#263442" font-family="Arial,sans-serif" font-size="12" font-weight="700">프로필 검색</text><rect x="74" y="170" width="412" height="48" rx="10" fill="#FFFFFF" stroke="#90CAF9"/><circle cx="98" cy="194" r="7" fill="none" stroke="#2196F3" stroke-width="2"/><path d="m103 200 7 7" stroke="#2196F3" stroke-width="2"/><text x="122" y="199" fill="#526272" font-family="Arial,sans-serif" font-size="13">범주 또는 필드 이름</text>
  <rect x="74" y="244" width="412" height="116" rx="14" fill="#FFFFFF" stroke="#D6E0E8"/><text x="94" y="274" fill="#2196F3" font-family="Arial,sans-serif" font-size="10" font-weight="700">연락처와 주소</text><text x="94" y="301" fill="#263442" font-family="Arial,sans-serif" font-size="15" font-weight="700">이메일주소</text><text x="94" y="334" fill="#526272" font-family="Arial,sans-serif" font-size="13">a***@example.com</text><rect x="410" y="310" width="56" height="30" rx="8" fill="#E3F2FD" stroke="#2196F3"/><text x="438" y="330" text-anchor="middle" fill="#0D47A1" font-family="Arial,sans-serif" font-size="11" font-weight="700">복사</text>
  <rect x="74" y="376" width="412" height="116" rx="14" fill="#FFFFFF" stroke="#D6E0E8"/><text x="94" y="406" fill="#2196F3" font-family="Arial,sans-serif" font-size="10" font-weight="700">병역 · 개별 확인 정보</text><text x="94" y="433" fill="#263442" font-family="Arial,sans-serif" font-size="15" font-weight="700">병역 상태</text><text x="94" y="466" fill="#526272" font-family="Arial,sans-serif" font-size="13">가려진 민감정보</text><rect x="398" y="442" width="68" height="30" rx="8" fill="#E3F2FD" stroke="#2196F3"/><text x="432" y="462" text-anchor="middle" fill="#0D47A1" font-family="Arial,sans-serif" font-size="11" font-weight="700">펼치기</text>
  <rect x="74" y="508" width="412" height="116" rx="14" fill="#FFFFFF" stroke="#D6E0E8"/><text x="94" y="538" fill="#2196F3" font-family="Arial,sans-serif" font-size="10" font-weight="700">프로젝트</text><text x="94" y="565" fill="#263442" font-family="Arial,sans-serif" font-size="15" font-weight="700">프로젝트 이름</text><text x="94" y="598" fill="#526272" font-family="Arial,sans-serif" font-size="13">[비식별 프로젝트]</text><rect x="410" y="574" width="56" height="30" rx="8" fill="#E3F2FD" stroke="#2196F3"/><text x="438" y="594" text-anchor="middle" fill="#0D47A1" font-family="Arial,sans-serif" font-size="11" font-weight="700">복사</text>
  <line x1="42" y1="744" x2="518" y2="744" stroke="#D6E0E8"/><rect x="74" y="770" width="412" height="50" rx="10" fill="#0D47A1"/><text x="280" y="802" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="15" font-weight="700">자동 기입</text><text x="280" y="842" text-anchor="middle" fill="#526272" font-family="Arial,sans-serif" font-size="10">분석 전에는 현재 페이지를 읽거나 바꾸지 않습니다.</text>
</svg>
