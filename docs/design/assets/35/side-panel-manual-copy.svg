  <desc id="desc">기본 인적사항과 연락처는 펼쳐 보고 나머지 범주는 요약해서 탐색하는 지원 정보 패널</desc>
  <rect width="560" height="900" fill="#F6F9FC"/>
  <rect x="42" y="20" width="476" height="860" rx="18" fill="#FFFFFF" stroke="#D6E0E8"/>

