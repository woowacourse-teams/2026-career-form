<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">자동 기입 네 가지 예외 상태</title><desc id="desc">지원하지 않는 페이지, 분석 실패, 검색 결과 없음, 일부 기입 실패 카드</desc>
  <style>text { font-family: "Pretendard Variable", Pretendard, Arial, sans-serif; }</style>
  <rect width="1200" height="760" fill="#F6F9FC"/><text x="70" y="70" fill="#2196F3" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">EXCEPTION STATES</text><text x="70" y="112" fill="#0D47A1" font-family="Arial,sans-serif" font-size="30" font-weight="700">실패를 성공처럼 숨기지 않습니다</text>
  <g font-family="Arial,sans-serif"><rect x="70" y="158" width="500" height="230" rx="20" fill="#FFFFFF" stroke="#D6E0E8"/><rect x="70" y="158" width="500" height="10" rx="5" fill="#0D47A1"/><circle cx="118" cy="218" r="22" fill="#E3F2FD"/><text x="118" y="225" text-anchor="middle" fill="#0D47A1" font-size="20" font-weight="700">1</text><text x="154" y="216" fill="#0D47A1" font-size="20" font-weight="700">지원하지 않는 페이지</text><text x="110" y="270" fill="#526272" font-size="13">자동 기입을 시작하지 않고 수동 복사를 유지합니다.</text><rect x="110" y="314" width="184" height="42" rx="9" fill="#0D47A1"/><text x="202" y="341" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">수동 복사 계속</text>
  <rect x="630" y="158" width="500" height="230" rx="20" fill="#FFFFFF" stroke="#D6E0E8"/><rect x="630" y="158" width="500" height="10" rx="5" fill="#2196F3"/><circle cx="678" cy="218" r="22" fill="#E3F2FD"/><text x="678" y="225" text-anchor="middle" fill="#0D47A1" font-size="20" font-weight="700">2</text><text x="714" y="216" fill="#0D47A1" font-size="20" font-weight="700">분석 실패</text><text x="670" y="270" fill="#526272" font-size="13">지원서 값이 변경되지 않았음을 먼저 알립니다.</text><rect x="670" y="314" width="144" height="42" rx="9" fill="#0D47A1"/><text x="742" y="341" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">다시 시도</text><rect x="826" y="314" width="144" height="42" rx="9" fill="#FFFFFF" stroke="#2196F3"/><text x="898" y="341" text-anchor="middle" fill="#0D47A1" font-size="13" font-weight="700">수동 복사</text>
  <rect x="70" y="428" width="500" height="230" rx="20" fill="#FFFFFF" stroke="#D6E0E8"/><rect x="70" y="428" width="500" height="10" rx="5" fill="#90CAF9"/><circle cx="118" cy="488" r="22" fill="#E3F2FD"/><text x="118" y="495" text-anchor="middle" fill="#0D47A1" font-size="20" font-weight="700">3</text><text x="154" y="486" fill="#0D47A1" font-size="20" font-weight="700">검색 결과 없음</text><text x="110" y="540" fill="#526272" font-size="13">검색어를 지우거나 다른 범주를 펼칠 수 있습니다.</text><rect x="110" y="584" width="184" height="42" rx="9" fill="#FFFFFF" stroke="#2196F3"/><text x="202" y="611" text-anchor="middle" fill="#0D47A1" font-size="13" font-weight="700">검색어 지우기</text>
  <rect x="630" y="428" width="500" height="230" rx="20" fill="#FFFFFF" stroke="#D6E0E8"/><rect x="630" y="428" width="500" height="10" rx="5" fill="#C62828"/><circle cx="678" cy="488" r="22" fill="#FDECEC"/><text x="678" y="495" text-anchor="middle" fill="#9F1D1D" font-size="20" font-weight="700">4</text><text x="714" y="486" fill="#0D47A1" font-size="20" font-weight="700">일부 기입 실패</text><text x="670" y="540" fill="#526272" font-size="13">성공과 실패를 구분하고 직접 입력 방법을 제공합니다.</text><rect x="670" y="584" width="214" height="42" rx="9" fill="#0D47A1"/><text x="777" y="611" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">수동 복사로 보완</text></g>
</svg>
