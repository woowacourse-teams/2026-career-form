<svg xmlns="http://www.w3.org/2000/svg" width="420" height="920" viewBox="0 0 420 920" role="img" aria-labelledby="title desc">
  <title id="title">S-01 사이드 패널 프로필 탐색과 수동 복사</title>
  <desc id="desc">검색, 정보 범주, 항목별 복사, 민감정보 가림과 자동 기입 버튼을 보여주는 회색조 와이어프레임</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #111827; }
    .frame { fill: #ffffff; stroke: #111827; stroke-width: 2; }
    .surface { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1; }
    .row { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .title { font-size: 19px; font-weight: 600; }
    .heading { font-size: 14px; font-weight: 600; }
    .body { font-size: 13px; }
    .small { font-size: 11px; fill: #4b5563; }
    .primary { fill: #111827; stroke: #111827; }
    .primary-text { fill: #ffffff; font-size: 14px; font-weight: 600; }
    .button { fill: #ffffff; stroke: #6b7280; }
    .button-text { font-size: 12px; font-weight: 600; }
    .divider { stroke: #d1d5db; stroke-width: 1; }
  </style>

  <rect class="frame" x="1" y="1" width="418" height="918"/>
  <text class="small" x="22" y="27">S-01 , 브라우저 사이드 패널</text>
  <text class="title" x="22" y="59">내 지원 정보</text>
  <text class="small" x="398" y="58" text-anchor="end">닫기</text>

  <rect class="surface" x="22" y="82" width="376" height="46" rx="7"/>
  <text class="body" x="40" y="111">정보 검색, 예: 이메일, 자격증, 학교</text>

  <text class="small" x="22" y="153">N / 10 범주 등록 , 직접 복사하거나 자동 기입을 시작하세요</text>

  <rect class="surface" x="22" y="174" width="376" height="40" rx="6"/>
  <text class="heading" x="38" y="199">기본 인적사항</text>
  <text class="body" x="379" y="199" text-anchor="end">접기</text>

  <rect class="row" x="22" y="214" width="376" height="62"/>
  <text class="small" x="38" y="237">국문 성</text>
  <text class="body" x="38" y="260">[국문 성]</text>
  <rect class="button" x="322" y="228" width="58" height="34" rx="5"/>
  <text class="button-text" x="351" y="250" text-anchor="middle">복사</text>

  <rect class="row" x="22" y="276" width="376" height="62"/>
  <text class="small" x="38" y="299">국문 이름</text>
  <text class="body" x="38" y="322">[국문 이름]</text>
  <rect class="button" x="322" y="290" width="58" height="34" rx="5"/>
  <text class="button-text" x="351" y="312" text-anchor="middle">복사</text>

  <rect class="surface" x="22" y="354" width="376" height="40" rx="6"/>
  <text class="heading" x="38" y="379">연락처와 주소</text>
  <text class="body" x="379" y="379" text-anchor="end">접기</text>

  <rect class="row" x="22" y="394" width="376" height="62"/>
  <text class="small" x="38" y="417">이메일주소</text>
  <text class="body" x="38" y="440">a***@example.com</text>
  <rect class="button" x="322" y="408" width="58" height="34" rx="5"/>
  <text class="button-text" x="351" y="430" text-anchor="middle">복사</text>

  <rect class="row" x="22" y="456" width="376" height="62"/>
  <text class="small" x="38" y="479">연락처</text>
  <text class="body" x="38" y="502">010-****-0000</text>
  <rect class="button" x="322" y="470" width="58" height="34" rx="5"/>
  <text class="button-text" x="351" y="492" text-anchor="middle">복사</text>

  <rect class="surface" x="22" y="534" width="376" height="48" rx="6"/>
  <text class="heading" x="38" y="564">학력</text>
  <text class="small" x="379" y="563" text-anchor="end">N건 , 펼치기</text>
  <rect class="surface" x="22" y="592" width="376" height="48" rx="6"/>
  <text class="heading" x="38" y="622">어학, 자격증, 프로젝트</text>
  <text class="small" x="379" y="621" text-anchor="end">N건 , 펼치기</text>

  <rect class="surface" x="22" y="650" width="376" height="112" rx="6"/>
  <text class="heading" x="38" y="680">민감정보</text>
  <text class="small" x="38" y="704">병역, 보훈, 장애와 건강</text>
  <text class="body" x="38" y="735">•••••••• , 값 가림</text>
  <rect class="button" x="300" y="712" width="80" height="34" rx="5"/>
  <text class="button-text" x="340" y="734" text-anchor="middle">펼치기</text>

  <line class="divider" x1="0" y1="796" x2="420" y2="796"/>
  <rect class="primary" x="22" y="820" width="376" height="52" rx="7"/>
  <text class="primary-text" x="210" y="852" text-anchor="middle">자동 기입</text>
  <text class="small" x="210" y="892" text-anchor="middle">선택 후 분석과 검토를 시작합니다</text>
</svg>
