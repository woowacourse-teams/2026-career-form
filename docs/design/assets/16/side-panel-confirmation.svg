<svg xmlns="http://www.w3.org/2000/svg" width="420" height="780" viewBox="0 0 420 780" role="img" aria-labelledby="title desc">
  <title id="title">S-04 사이드 패널 최종 승인</title>
  <desc id="desc">변경할 항목 수, 민감정보와 충돌 항목, 제출 금지 경계를 최종 확인하는 회색조 와이어프레임</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #111827; }
    .frame { fill: #ffffff; stroke: #111827; stroke-width: 2; }
    .surface { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1; }
    .warning { fill: #ffffff; stroke: #4b5563; stroke-width: 2; }
    .title { font-size: 19px; font-weight: 600; }
    .heading { font-size: 14px; font-weight: 600; }
    .body { font-size: 13px; }
    .small { font-size: 11px; fill: #4b5563; }
    .primary { fill: #111827; stroke: #111827; }
    .secondary { fill: #ffffff; stroke: #111827; }
    .primary-text { fill: #ffffff; font-size: 14px; font-weight: 600; }
    .button-text { font-size: 14px; font-weight: 600; }
    .divider { stroke: #d1d5db; stroke-width: 1; }
  </style>

  <rect class="frame" x="1" y="1" width="418" height="778"/>
  <text class="small" x="22" y="27">S-04 , 브라우저 사이드 패널</text>
  <text class="title" x="22" y="61">N개 항목을 기입할까요?</text>
  <text class="body" x="22" y="89">승인하면 아래 항목만 지원서에서 변경됩니다.</text>

  <rect class="surface" x="22" y="118" width="376" height="174" rx="7"/>
  <text class="heading" x="40" y="148">선택 항목 요약</text>
  <line class="divider" x1="40" y1="164" x2="380" y2="164"/>
  <text class="body" x="40" y="192">기본 인적사항</text>
  <text class="small" x="380" y="192" text-anchor="end">N개</text>
  <text class="body" x="40" y="226">연락처와 주소</text>
  <text class="small" x="380" y="226" text-anchor="end">N개</text>
  <text class="body" x="40" y="260">학력과 어학</text>
  <text class="small" x="380" y="260" text-anchor="end">N개</text>

  <rect class="warning" x="22" y="316" width="376" height="126" rx="7"/>
  <text class="heading" x="40" y="347">추가 확인 항목</text>
  <text class="body" x="40" y="376">민감정보 N개</text>
  <text class="small" x="40" y="397">값을 펼쳐 직접 선택한 항목만 포함</text>
  <text class="body" x="40" y="423">기존 값 덮어쓰기 N개</text>

  <rect class="surface" x="22" y="466" width="376" height="120" rx="7"/>
  <text class="heading" x="40" y="497">확장 프로그램이 하지 않는 일</text>
  <text class="body" x="40" y="525">지원서 저장 또는 임시저장</text>
  <text class="body" x="40" y="550">다음 단계 이동, 미리보기와 최종 제출</text>
  <text class="small" x="40" y="573">기입 후 실제 값은 사용자가 지원서에서 확인</text>

  <rect class="secondary" x="22" y="626" width="178" height="50" rx="7"/>
  <text class="button-text" x="111" y="657" text-anchor="middle">검토로 돌아가기</text>
  <rect class="primary" x="220" y="626" width="178" height="50" rx="7"/>
  <text class="primary-text" x="309" y="657" text-anchor="middle">기입하기</text>
  <text class="small" x="210" y="724" text-anchor="middle">이 버튼이 실제 기입을 시작하는 최종 승인</text>
</svg>
