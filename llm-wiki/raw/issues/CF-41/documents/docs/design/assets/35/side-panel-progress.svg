<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900" role="img" aria-labelledby="title desc"><title id="title">승인 항목 기입 중</title><desc id="desc">완료, 처리 중과 대기 상태를 보여주는 패널</desc>
  <style>text { font-family: "Pretendard Variable", Pretendard, Arial, sans-serif; }</style>
  <rect width="560" height="900" fill="#F6F9FC"/><rect x="42" y="28" width="476" height="844" rx="22" fill="#FFFFFF" stroke="#D6E0E8"/>
  <text x="74" y="82" fill="#2196F3" font-family="Arial,sans-serif" font-size="11" font-weight="700">4 / 4</text><text x="74" y="120" fill="#0D47A1" font-family="Arial,sans-serif" font-size="26" font-weight="700">기입 중</text>
  <rect x="74" y="166" width="412" height="12" rx="6" fill="#E3F2FD"/><rect x="74" y="166" width="258" height="12" rx="6" fill="#2196F3"/>
  <g font-family="Arial,sans-serif"><rect x="74" y="220" width="412" height="82" rx="12" fill="#FFFFFF" stroke="#D6E0E8"/><circle cx="104" cy="261" r="14" fill="#18794E"/><path d="m97 261 5 5 9-12" fill="none" stroke="#FFFFFF" stroke-width="3"/><text x="132" y="256" fill="#263442" font-size="14" font-weight="700">이메일주소</text><text x="132" y="278" fill="#526272" font-size="11">완료</text>
  <rect x="74" y="316" width="412" height="82" rx="12" fill="#E3F2FD" stroke="#90CAF9"/><circle cx="104" cy="357" r="14" fill="#2196F3"/><circle cx="104" cy="357" r="6" fill="#FFFFFF"/><text x="132" y="352" fill="#0D47A1" font-size="14" font-weight="700">선택한 항목</text><text x="132" y="374" fill="#526272" font-size="11">처리 중</text>
  <rect x="74" y="412" width="412" height="82" rx="12" fill="#F4F7FA" stroke="#D6E0E8"/><circle cx="104" cy="453" r="14" fill="#D6E0E8"/><text x="132" y="448" fill="#526272" font-size="14" font-weight="700">결과 확인</text><text x="132" y="470" fill="#526272" font-size="11">대기</text></g>
  <rect x="74" y="548" width="412" height="78" rx="12" fill="#E3F2FD" stroke="#90CAF9"/><text x="96" y="581" fill="#0D47A1" font-family="Arial,sans-serif" font-size="13" font-weight="700">승인된 항목만 처리합니다.</text><text x="96" y="605" fill="#526272" font-family="Arial,sans-serif" font-size="12">저장, 이동과 제출은 실행하지 않습니다.</text>
  <rect x="74" y="756" width="412" height="52" rx="10" fill="#0D47A1"/><text x="280" y="789" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="15" font-weight="700">결과 보기</text>
</svg>
