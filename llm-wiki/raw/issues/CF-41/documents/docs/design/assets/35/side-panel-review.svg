<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900" role="img" aria-labelledby="title desc"><title id="title">입력 예정 항목 검토</title><desc id="desc">상태별 입력 예정 항목과 기본 선택 정책을 보여주는 패널</desc>
  <style>text { font-family: "Pretendard Variable", Pretendard, Arial, sans-serif; }</style>
  <rect width="560" height="900" fill="#F6F9FC"/><rect x="42" y="28" width="476" height="844" rx="22" fill="#FFFFFF" stroke="#D6E0E8"/>
  <text x="74" y="72" fill="#2196F3" font-family="Arial,sans-serif" font-size="11" font-weight="700">2 / 4</text><text x="74" y="106" fill="#0D47A1" font-family="Arial,sans-serif" font-size="24" font-weight="700">입력 예정 항목 검토</text><text x="74" y="136" fill="#526272" font-family="Arial,sans-serif" font-size="12">변경할 항목만 선택하세요.</text>
  <g font-family="Arial,sans-serif"><rect x="74" y="168" width="412" height="92" rx="12" fill="#FFFFFF" stroke="#D6E0E8"/><rect x="74" y="168" width="5" height="92" rx="2" fill="#18794E"/><rect x="94" y="192" width="18" height="18" rx="4" fill="#0D47A1"/><path d="m98 201 4 4 7-9" fill="none" stroke="#FFFFFF" stroke-width="2"/><text x="128" y="200" fill="#263442" font-size="14" font-weight="700">이메일주소</text><text x="128" y="226" fill="#526272" font-size="12">a***@example.com</text><text x="462" y="201" text-anchor="end" fill="#18794E" font-size="10" font-weight="700">입력 가능</text>
  <rect x="74" y="272" width="412" height="92" rx="12" fill="#FFFFFF" stroke="#D6E0E8"/><rect x="74" y="272" width="5" height="92" rx="2" fill="#2196F3"/><rect x="94" y="296" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#8C9BAA"/><text x="128" y="304" fill="#263442" font-size="14" font-weight="700">국적</text><text x="128" y="330" fill="#526272" font-size="12">지원서 선택지 확인 필요</text><text x="462" y="305" text-anchor="end" fill="#0D47A1" font-size="10" font-weight="700">확인 필요</text>
  <rect x="74" y="376" width="412" height="92" rx="12" fill="#FFFFFF" stroke="#D6E0E8"/><rect x="74" y="376" width="5" height="92" rx="2" fill="#C62828"/><rect x="94" y="400" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#8C9BAA"/><text x="128" y="408" fill="#263442" font-size="14" font-weight="700">연락처</text><text x="128" y="434" fill="#526272" font-size="12">기존 값 있음 · 덮어쓰기 확인</text><text x="462" y="409" text-anchor="end" fill="#9F1D1D" font-size="10" font-weight="700">기존 값 충돌</text>
  <rect x="74" y="480" width="412" height="92" rx="12" fill="#FFFFFF" stroke="#D6E0E8"/><rect x="74" y="480" width="5" height="92" rx="2" fill="#C62828"/><rect x="94" y="504" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#8C9BAA"/><text x="128" y="512" fill="#263442" font-size="14" font-weight="700">보훈 대상 여부</text><text x="128" y="538" fill="#526272" font-size="12">가려진 민감정보</text><text x="462" y="513" text-anchor="end" fill="#9F1D1D" font-size="10" font-weight="700">민감정보</text>
  <rect x="74" y="584" width="412" height="92" rx="12" fill="#F4F7FA" stroke="#D6E0E8"/><rect x="94" y="608" width="18" height="18" rx="4" fill="#E1E7EC"/><text x="128" y="616" fill="#526272" font-size="14" font-weight="700">지원 동기</text><text x="128" y="642" fill="#526272" font-size="12">프로필 저장 대상이 아님</text><text x="462" y="617" text-anchor="end" fill="#526272" font-size="10" font-weight="700">입력 불가</text></g>
  <rect x="74" y="756" width="412" height="52" rx="10" fill="#0D47A1"/><text x="280" y="789" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="15" font-weight="700">선택한 항목 확인</text>
</svg>
