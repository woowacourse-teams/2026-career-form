openapi: 3.1.0
info:
  title: Application Form Analysis API
  version: 1.0.0
  description: 비식별 지원서 DOM snapshot 분석 계약이다. 인증 방식은 이 명세 범위 밖이다.
paths:
  /api/v1/application-forms/analyze:
    post:
      summary: 지원서 snapshot 분석
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '200':
          description: preparation 또는 field analysis 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400':
          description: schema, ID 관계 또는 enum이 올바르지 않은 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: snapshot 크기 또는 section/candidate 수 제한 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 분석 요청 제한 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 분석 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AnalyzeRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, snapshotId, site, sections]
      properties:
        schemaVersion:
          type: integer
          const: 1
        snapshotId:
          type: string
          minLength: 1
        site:
          $ref: '#/components/schemas/Site'
        sections:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Section'
    Site:
      type: object
      additionalProperties: false
      required: [host, pathPattern]
      properties:
        host:
          type: string
          minLength: 1
        pathPattern:
          type: string
          minLength: 1
    Section:
      type: object
      additionalProperties: false
      required: [sectionId, fields]
      properties:
        sectionId:
          type: string
          minLength: 1
        parentSectionId:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldCandidate'
        actionCandidates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ActionCandidate'
    FieldCandidate:
      type: object
      additionalProperties: false
      required: [candidateId, element, control, visibility]
      properties:
        candidateId:
          type: string
          minLength: 1
        element:
          type: string
          enum: [input, select, textarea, custom]
        control:
          type: string
          enum: [text, select, radio, checkbox, textarea, custom]
        visibility:
          type: string
          enum: [visible, hidden]
        groupId:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        domId:
          type: string
          minLength: 1
        domName:
          type: string
          minLength: 1
        placeholder:
          type: string
          minLength: 1
        disabled:
          type: boolean
          const: true
        readonly:
          type: boolean
          const: true
        inert:
          type: boolean
          const: true
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Option'
    ActionCandidate:
      type: object
      additionalProperties: false
      required: [candidateId, element, control, visibility]
      properties:
        candidateId:
          type: string
          minLength: 1
        element:
          type: string
          enum: [button, custom]
        control:
          type: string
          enum: [button, custom]
        visibility:
          type: string
          enum: [visible, hidden]
        displayName:
          type: string
          minLength: 1
        domId:
          type: string
          minLength: 1
        domName:
          type: string
          minLength: 1
        disabled:
          type: boolean
          const: true
        inert:
          type: boolean
          const: true
    Option:
      type: object
      additionalProperties: false
      required: [optionId, displayName]
      properties:
        optionId:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
    AnalyzeResponse:
      type: object
      additionalProperties: false
      required: [snapshotId, mode, analysisStatus, fields]
      properties:
        snapshotId:
          type: string
          minLength: 1
        mode:
          type: string
          enum: [ADAPTER, GENERIC]
        analysisStatus:
          type: string
          enum: [COMPLETE, PARTIAL, BLOCKED]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldAnalysis'
        preparationPlans:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PreparationPlan'
        warningCodes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [UNRESOLVED_FIELD, MANUAL_REVEAL_REQUIRED, LLM_UNAVAILABLE]
        blockCode:
          type: string
          enum: [ADAPTER_STRUCTURE_MISMATCH, UNSUPPORTED_SNAPSHOT]
    FieldAnalysis:
      type: object
      additionalProperties: false
      required: [candidateId, mappingStatus, interactionStatus]
      properties:
        candidateId:
          type: string
          minLength: 1
        profileField:
          type: string
          enum: [koreanFamilyName, koreanGivenName, englishFamilyName, englishGivenName, email, phoneNumber, birthDate, nationality, schoolName, degreeLevel, majorName, startDate, endDate, language, testName, registrationNo, acquisitionDate, grade, issuer, projectName, role, activityDetails, NO_MATCH]
        mappingStatus:
          type: string
          enum: [ADAPTER_VERIFIED, RULE_MATCHED, LLM_SUGGESTED, UNKNOWN, OUT_OF_SCOPE]
        interactionStatus:
          type: string
          enum: [READY, REVEAL_REQUIRED, MANUAL_REVEAL_REQUIRED, BLOCKED, SYSTEM_CONTROL, UNVERIFIED]
        writePlan:
          $ref: '#/components/schemas/WritePlan'
        reasonCodes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [UNKNOWN, BLOCKED, UNVERIFIED, OUT_OF_SCOPE]
    WritePlan:
      type: object
      additionalProperties: false
      required: [command]
      properties:
        command:
          type: string
          enum: [SET_TEXT, SELECT_OPTION, CHECK_RADIO, CHECK_CHECKBOX]
    PreparationPlan:
      type: object
      additionalProperties: false
      required: [actionCandidateId, command, expectedEffect, maxExecutions]
      properties:
        actionCandidateId:
          type: string
          minLength: 1
        command:
          type: string
          enum: [REVEAL_SECTION, ADD_REPEATABLE_GROUP]
        expectedEffect:
          type: string
          enum: [TARGET_VISIBLE, GROUP_COUNT_INCREMENT, DOM_MUTATION]
        maxExecutions:
          type: integer
          minimum: 1
          maximum: 3
        targetSectionId:
          type: string
          minLength: 1
    LlmMappingOutput:
      type: object
      additionalProperties: false
      required: [candidateId, profileField]
      properties:
        candidateId:
          type: string
          minLength: 1
        profileField:
          type: string
          enum: [koreanFamilyName, koreanGivenName, englishFamilyName, englishGivenName, email, phoneNumber, birthDate, nationality, schoolName, degreeLevel, majorName, startDate, endDate, language, testName, registrationNo, acquisitionDate, grade, issuer, projectName, role, activityDetails, NO_MATCH]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_REQUEST, SNAPSHOT_TOO_LARGE, RATE_LIMITED, INTERNAL_ERROR]
        message:
          type: string
          minLength: 1
