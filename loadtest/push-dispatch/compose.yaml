# 공고 알림 발송 시험 스택. loadtest/push-dispatch/에서 실행한다.
#   python make-test-env.py
#   mkdir -p runs/<실행 id>/mock
#   LOADTEST_RUN_DIR=runs/<실행 id> docker compose --env-file .env.loadtest up -d --build --wait
# 포트는 모두 127.0.0.1에만 연다. 시험 트래픽은 모의 푸시 서버로만 가고 전용 MongoDB만 쓴다.
# 후 측정(SQS 방식)은 큐 주소를 주고 worker 서비스를 함께 띄운다. 백엔드는 릴레이만, worker는 발송만 한다.
#   LOADTEST_PUSH_TRANSPORT=sqs LOADTEST_SQS_QUEUE_URL=<측정용 큐 주소> LOADTEST_RUN_DIR=runs/<실행 id> \
#     docker compose --env-file .env.loadtest --profile sqs up -d --build --wait
# 노트북 리허설은 --profile local-sqs로 SQS 대체물(ElasticMQ)을 함께 띄운다. 공식 측정에는 쓰지 않는다. 자세한 순서는 README를 본다.
name: cf-push-loadtest

services:
  mongodb:
    # 운영과 같은 단일 노드(standalone)로 띄운다. replica set으로 바꾸지 않는다.
    # 기본 이미지는 운영 고정 이미지다. 리눅스 커널 6.19 이상에서는 기동을 거부하므로 그때는 LOADTEST_MONGODB_IMAGE로 바꾼다.
    image: ${LOADTEST_MONGODB_IMAGE:-mongo:8.0.26-noble@sha256:b49841837cd7688885d7479d14a71733bacae4c99faaae615622384eaee045a0}
    ports:
      - "127.0.0.1:${LOADTEST_MONGODB_PORT:-27018}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 12

  mock-push:
    image: ${LOADTEST_MOCK_IMAGE:-python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b}
    init: true
    # 상태 추첨 시드를 고정해 전과 후가 같은 순서의 응답 상태를 받게 한다.
    command: ["python", "-u", "/app/mock-push-server.py", "--host", "0.0.0.0", "--port", "8080", "--log", "/data/requests.jsonl",
              "--seed", "${MOCK_SEED:-441}"]
    environment:
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-100}
      MOCK_STATUSES: ${MOCK_STATUSES:-201=1}
      MOCK_RETRY_AFTER_SECONDS: ${MOCK_RETRY_AFTER_SECONDS:-60}
    volumes:
      # 모의 서버 코드만 읽기 전용으로 넣는다. 기록은 실행 폴더의 mock/ 하위 폴더에만 쓴다.
      # 실행 폴더의 키 파일(subscriber-keys.jsonl)과 .env.loadtest는 컨테이너에 넣지 않는다.
      - ./mock-push-server.py:/app/mock-push-server.py:ro
      - ./pushload:/app/pushload:ro
      - type: bind
        source: ${LOADTEST_RUN_DIR:?LOADTEST_RUN_DIR must be the run folder, e.g. runs/<run id>}/mock
        target: /data
        bind:
          create_host_path: true
    ports:
      - "127.0.0.1:${LOADTEST_MOCK_PORT:-28081}:8080"

  backend:
    build:
      context: ${LOADTEST_BACKEND_CONTEXT:-../../backend}
    image: cf-push-loadtest-backend:${LOADTEST_BACKEND_TAG:-local}
    # 운영 배포(infra/scripts/deploy.sh)는 루트 compose.yaml과 infra/compose.deploy.yaml을 합쳐 쓰고,
    # 루트 compose.yaml의 init과 종료 유예 30초가 그대로 적용된다. S3 재시작 조건을 맞추려고 같은 값을 둔다.
    # 운영에는 자원 제한이 없으므로 제한값은 운영 앱 호스트 사양에 맞춘다.
    init: true
    stop_grace_period: 30s
    cpus: ${LOADTEST_BACKEND_CPUS:-2}
    mem_limit: ${LOADTEST_BACKEND_MEMORY:-2g}
    # 발송기 설정(주기, 동시성 20, 한 주기 상한)은 앱 기본값을 그대로 쓴다.
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/career_form_loadtest
      CAREER_FORM_NOTIFICATION_ENABLED: "true"
      CAREER_FORM_QUALITY_ENABLED: "true"
      CAREER_FORM_OTEL_ENABLED: "false"
      CAREER_FORM_PUSH_VAPID_PUBLIC_KEY: ${CAREER_FORM_PUSH_VAPID_PUBLIC_KEY:?run make-test-env.py and pass --env-file .env.loadtest}
      CAREER_FORM_PUSH_VAPID_PRIVATE_KEY: ${CAREER_FORM_PUSH_VAPID_PRIVATE_KEY:?run make-test-env.py and pass --env-file .env.loadtest}
      CAREER_FORM_PUSH_VAPID_SUBJECT: ${CAREER_FORM_PUSH_VAPID_SUBJECT:?run make-test-env.py and pass --env-file .env.loadtest}
      CAREER_FORM_QUALITY_PASSWORD_HASH: ${CAREER_FORM_QUALITY_PASSWORD_HASH:?run make-test-env.py and pass --env-file .env.loadtest}
      # 발송 방식. 기본은 지금 방식(direct)이고 그때 아래 SQS 값은 쓰이지 않는다. 전환 직전 커밋의 jar는 이 변수들을 읽지 않는다.
      # SQS 방식에서 백엔드는 릴레이만 돌린다. 발송은 worker 서비스가 맡아 동시 발송 수 합계가 20으로 유지된다.
      CAREER_FORM_PUSH_TRANSPORT: ${LOADTEST_PUSH_TRANSPORT:-direct}
      CAREER_FORM_PUSH_SQS_QUEUE_URL: ${LOADTEST_SQS_QUEUE_URL:-}
      CAREER_FORM_PUSH_SQS_REGION: ${LOADTEST_SQS_REGION:-ap-northeast-2}
      CAREER_FORM_PUSH_SQS_ENDPOINT: ${LOADTEST_SQS_ENDPOINT:-}
      CAREER_FORM_PUSH_WORKER_ENABLED: "false"
      # 값을 여기 적지 않는다. 셸에 있을 때만 그대로 넘어간다. EC2에서는 셸에 두지 않아 인스턴스 역할을 쓰고,
      # 노트북 리허설에서만 SQS 대체물용 가짜 값을 셸에 준다.
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
    ports:
      # 18080·18081은 팀 관리 터널(dev·staging)이 쓰는 로컬 포트라 피한다.
      - "127.0.0.1:${LOADTEST_BACKEND_PORT:-28080}:8080"
      - "127.0.0.1:${LOADTEST_MANAGEMENT_PORT:-29091}:9091"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9091/actuator/health"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      mongodb:
        condition: service_healthy
      mock-push:
        condition: service_started

  worker:
    # SQS 방식의 발송 워커. --profile sqs일 때만 뜬다. 백엔드가 빌드한 것과 같은 이미지에서 워커만 켠다.
    profiles: ["sqs"]
    image: cf-push-loadtest-backend:${LOADTEST_BACKEND_TAG:-local}
    init: true
    stop_grace_period: 30s
    # 전 측정에는 없는 컨테이너다. 제한값을 어떻게 두었는지 실행 메모에 적는다.
    cpus: ${LOADTEST_WORKER_CPUS:-2}
    mem_limit: ${LOADTEST_WORKER_MEMORY:-2g}
    # 발송 설정(동시성 20, lease)은 앱 기본값을 그대로 쓴다.
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/career_form_loadtest
      CAREER_FORM_NOTIFICATION_ENABLED: "true"
      CAREER_FORM_QUALITY_ENABLED: "true"
      CAREER_FORM_OTEL_ENABLED: "false"
      CAREER_FORM_PUSH_VAPID_PUBLIC_KEY: ${CAREER_FORM_PUSH_VAPID_PUBLIC_KEY:?run make-test-env.py and pass --env-file .env.loadtest}
      CAREER_FORM_PUSH_VAPID_PRIVATE_KEY: ${CAREER_FORM_PUSH_VAPID_PRIVATE_KEY:?run make-test-env.py and pass --env-file .env.loadtest}
      CAREER_FORM_PUSH_VAPID_SUBJECT: ${CAREER_FORM_PUSH_VAPID_SUBJECT:?run make-test-env.py and pass --env-file .env.loadtest}
      CAREER_FORM_QUALITY_PASSWORD_HASH: ${CAREER_FORM_QUALITY_PASSWORD_HASH:?run make-test-env.py and pass --env-file .env.loadtest}
      CAREER_FORM_PUSH_TRANSPORT: sqs
      # 필수 변수(:?)로 두지 않는다. compose는 꺼진 profile의 서비스도 변수를 풀어서, 지금 방식 실행까지 막는다.
      # 큐 주소가 비면 앱이 기동을 멈춘다.
      CAREER_FORM_PUSH_SQS_QUEUE_URL: ${LOADTEST_SQS_QUEUE_URL:-}
      CAREER_FORM_PUSH_SQS_REGION: ${LOADTEST_SQS_REGION:-ap-northeast-2}
      CAREER_FORM_PUSH_SQS_ENDPOINT: ${LOADTEST_SQS_ENDPOINT:-}
      CAREER_FORM_PUSH_RELAY_ENABLED: "false"
      CAREER_FORM_PUSH_WORKER_ENABLED: "true"
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
    ports:
      # 지표와 상태 확인용 관리 포트만 연다. API 포트는 열지 않는다.
      - "127.0.0.1:${LOADTEST_WORKER_MANAGEMENT_PORT:-29092}:9091"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9091/actuator/health"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      mongodb:
        condition: service_healthy
      mock-push:
        condition: service_started
      backend:
        condition: service_started

  elasticmq:
    # 노트북 리허설 전용 SQS 대체물. --profile local-sqs일 때만 뜬다. 실제 SQS 왕복이 빠지므로 공식 측정에는 쓰지 않는다.
    profiles: ["local-sqs"]
    image: ${LOADTEST_ELASTICMQ_IMAGE:-softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c}
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "127.0.0.1:${LOADTEST_ELASTICMQ_PORT:-29324}:9324"

volumes:
  mongodb-data:
