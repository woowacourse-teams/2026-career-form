// 노트북 리허설 전용 SQS 대체물(ElasticMQ) 설정. 공식 측정에는 쓰지 않는다.
// 큐 주소: http://elasticmq:9324/000000000000/loadtest-push
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

// 측정용 큐와 같은 모양: 표준 큐, 가시성 타임아웃 60초, 재전달 10번 뒤 DLQ.
queues {
  loadtest-push {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "loadtest-push-dlq"
      maxReceiveCount = 10
    }
  }
  loadtest-push-dlq { }
}
